<section id="section-projects" class="section" aria-labelledby="projects-title">
  <div class="container">
    <app-section-header
      index="03"
      [title]="'Deployed Projects'"
      [sub]="'$ ls ./secure-projects --encrypted  Hover a card to trigger the decryption routine.'"
    />

    <div class="projects-grid">
      @for (project of projects; track project.id) {
        <a
          class="project-card panel"
          [class.proj-game]="project.kind === 'game'"
          [class.proj-security]="project.kind === 'security'"
          [class.proj-backend]="project.kind === 'backend'"
          [class.proj-cli]="project.kind === 'cli'"
          [href]="project.url"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'Open project: ' + project.title"
          (mouseenter)="decrypt($event, project.title)"
          appReveal
        >
          <div class="scanline" aria-hidden="true"></div>

          <div class="card-glow" aria-hidden="true"></div>

          <div class="card-head">
            <i class="card-glyph {{ project.icon }}" aria-hidden="true"></i>
            <span class="head-badges">
              @if (project.wip) {
                <span class="wip-chip">WIP</span>
              }
              @if (project.kind === 'game') {
                <span class="game-chip" aria-hidden="true">8-BIT / CRT</span>
              }
              <span class="card-context">{{ project.context }}</span>
            </span>
          </div>

          <h3 class="project-title">{{ project.title }}</h3>

          <p class="project-desc">{{ project.description }}</p>

          <div class="card-foot">
            <ul class="tag-list">
              @for (tag of project.tags; track tag) {
                <li class="tag">{{ tag }}</li>
              }
            </ul>
            <span class="access-tag">
              <i class="fa-solid fa-up-right-from-square" aria-hidden="true"></i>
              DECRYPTED · OPEN
            </span>
          </div>
        </a>
      }
    </div>
  </div>
</section>
