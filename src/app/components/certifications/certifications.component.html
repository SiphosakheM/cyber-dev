<section id="section-certs" class="section" aria-labelledby="certs-title">
  <div class="container">
    <app-section-header
      index="04"
      [title]="'Verified Credentials'"
      [sub]="'$ openssl verify badges.crt — certificates & badges issued and verified.'"
    />

    <div class="certs-grid">
      @for (cert of certifications; track cert.title) {
        <article
          class="cert-card panel"
          [class.accent-cyan]="cert.accent === 'cyan'"
          [class.accent-purple]="cert.accent === 'purple'"
          appReveal
        >
          <div class="cert-icon" aria-hidden="true">
            <i class="{{ cert.icon }}"></i>
          </div>
          <div class="cert-copy">
            <h3 class="cert-title">{{ cert.title }}</h3>
            <p class="cert-issuer">{{ cert.issuer }}</p>
          </div>
          <span class="cert-status">VERIFIED &#10003;</span>
        </article>
      }
    </div>
  </div>
</section>
